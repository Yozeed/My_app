<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกรายรับ-รายจ่าย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="pb-10">

    <!-- Header -->
    <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
        <h1 class="text-xl font-bold text-center"><i class="fas fa-wallet mr-2"></i>สมุดบัญชีส่วนตัว</h1>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">

        <!-- Dashboard Summary -->
        <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                <span class="text-xs text-slate-500 block">รายรับ</span>
                <span id="total-income" class="text-emerald-600 font-semibold text-sm">฿0</span>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                <span class="text-xs text-slate-500 block">รายจ่าย</span>
                <span id="total-expense" class="text-rose-600 font-semibold text-sm">฿0</span>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                <span class="text-xs text-slate-500 block">คงเหลือ</span>
                <span id="total-balance" class="text-indigo-600 font-bold text-sm">฿0</span>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
            <h2 class="text-sm font-semibold text-slate-700 mb-2"><i class="fas fa-plus-circle text-indigo-500 mr-1"></i> เพิ่มรายการใหม่</h2>
            
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-expense" onclick="setType('expense')" class="py-2 text-sm font-medium rounded-lg bg-rose-500 text-white shadow-sm transition">รายจ่าย</button>
                <button id="btn-income" onclick="setType('income')" class="py-2 text-sm font-medium rounded-lg bg-slate-100 text-slate-600 transition">รายรับ</button>
            </div>

            <input type="number" id="amount" placeholder="จำนวนเงิน (บาท)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
            
            <input type="text" id="note" placeholder="รายละเอียด (เช่น ค่าอาหาร, ฟิล์มกันรอย)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500">

            <select id="category" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 text-slate-600">
                <option value="อาหาร">🍔 อาหาร/เครื่องดื่ม</option>
                <option value="เดินทาง">🚗 เดินทาง/น้ำมัน</option>
                <option value="ช้อปปิ้ง">🛍️ ช้อปปิ้ง/ของใช้</option>
                <option value="ธุรกิจ">💼 ธุรกิจ/นายหน้า/สินค้า</option>
                <option value="สาธารณูปโภค">🏠 ค่าน้ำ/ค่าไฟ/เน็ต</option>
                <option value="อื่นๆ">🌀 อื่นๆ</option>
            </select>

            <button onclick="addTransaction()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-sm font-medium transition shadow-sm">
                บันทึกรายการ
            </button>
        </div>

        <!-- Chart -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
            <h2 class="text-sm font-semibold text-slate-700 mb-2"><i class="fas fa-chart-pie text-indigo-500 mr-1"></i> สรุปสัดส่วนรายจ่าย</h2>
            <div class="w-full h-48 flex justify-center items-center">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- Recent Transactions -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-semibold text-slate-700"><i class="fas fa-list-ul text-indigo-500 mr-1"></i> รายการล่าสุด</h2>
                <button onclick="clearAll()" class="text-xs text-rose-500 hover:underline">ลบทั้งหมด</button>
            </div>
            <div id="transaction-list" class="space-y-2 max-h-60 overflow-y-auto">
                <p class="text-xs text-slate-400 text-center py-4">ยังไม่มีรายการบันทึก</p>
            </div>
        </div>

    </div>

    <script>
        let currentType = 'expense';
        let transactions = JSON.parse(localStorage.getItem('my_transactions')) || [];
        let chart = null;

        function setType(type) {
            currentType = type;
            const btnExpense = document.getElementById('btn-expense');
            const btnIncome = document.getElementById('btn-income');

            if(type === 'expense') {
                btnExpense.className = "py-2 text-sm font-medium rounded-lg bg-rose-500 text-white shadow-sm transition";
                btnIncome.className = "py-2 text-sm font-medium rounded-lg bg-slate-100 text-slate-600 transition";
            } else {
                btnIncome.className = "py-2 text-sm font-medium rounded-lg bg-emerald-500 text-white shadow-sm transition";
                btnExpense.className = "py-2 text-sm font-medium rounded-lg bg-slate-100 text-slate-600 transition";
            }
        }

        function addTransaction() {
            const amountInput = document.getElementById('amount');
            const noteInput = document.getElementById('note');
            const categorySelect = document.getElementById('category');

            const amount = parseFloat(amountInput.value);
            const note = noteInput.value.trim();
            const category = categorySelect.value;

            if (!amount || amount <= 0) {
                alert('กรุณากรอกจำนวนเงินให้ถูกต้อง');
                return;
            }

            const item = {
                id: Date.now(),
                type: currentType,
                amount: amount,
                note: note || category,
                category: category,
                date: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })
            };

            transactions.unshift(item);
            saveAndRender();

            amountInput.value = '';
                noteInput.value = '';
        }

        function deleteItem(id) {
            transactions = transactions.filter(item => item.id !== id);
            saveAndRender();
        }

        function clearAll() {
            if (confirm('ต้องการลบข้อมูลทั้งหมดใช่หรือไม่?')) {
                transactions = [];
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('my_transactions', JSON.stringify(transactions));
            renderUI();
        }

        function renderUI() {
            let totalIncome = 0;
            let totalExpense = 0;
            const listEl = document.getElementById('transaction-list');
            listEl.innerHTML = '';

            const categoryTotals = {};

            transactions.forEach(item => {
                if (item.type === 'income') {
                    totalIncome += item.amount;
                } else {
                    totalExpense += item.amount;
                    categoryTotals[item.category] = (categoryTotals[item.category] || 0) + item.amount;
                }

                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-2.5 bg-slate-50 rounded-lg border border-slate-100 text-xs";
                div.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="font-medium text-slate-700">${item.note}</span>
                        <span class="text-slate-400">(${item.date})</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="${item.type === 'income' ? 'text-emerald-600' : 'text-rose-600'} font-semibold">
                            ${item.type === 'income' ? '+' : '-'}฿${item.amount.toLocaleString()}
                        </span>
                        <button onclick="deleteItem(${item.id})" class="text-slate-300 hover:text-rose-500"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                listEl.appendChild(div);
            });

            if (transactions.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">ยังไม่มีรายการบันทึก</p>';
            }

            document.getElementById('total-income').innerText = '฿' + totalIncome.toLocaleString();
            document.getElementById('total-expense').innerText = '฿' + totalExpense.toLocaleString();
            document.getElementById('total-balance').innerText = '฿' + (totalIncome - totalExpense).toLocaleString();

            renderChart(categoryTotals);
        }

        function renderChart(categoryTotals) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const labels = Object.keys(categoryTotals);
            const data = Object.values(categoryTotals);

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length ? labels : ['ไม่มีข้อมูล'],
                    datasets: [{
                        data: data.length ? data : [1],
                        backgroundColor: labels.length ? [
                            '#f43f5e', '#3b82f6', '#ec4899', '#8b5cf6', '#eab308', '#64748b'
                        ] : ['#e2e8f0']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } }
                    }
                }
            });
        }

        renderUI();
    </script>
</body>
</html>
